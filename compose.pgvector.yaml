services:
  vectors:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: evidence
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evidence"]
      interval: 2s
      timeout: 2s
      retries: 30
